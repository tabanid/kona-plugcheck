# Copy to plugcheck.cfg and fill in. plugcheck.cfg is not tracked by git.
[plugcheck]
# BlueLink login is read from your existing monitor setup
monitor_cfg = ~/konaev/hyundai_kia_connect_monitor-R4.2.0/monitor.cfg

# Home location (decimal degrees)
home_lat = 0.0
home_lon = 0.0
home_radius_m = 150

# Only wake the car for fresh data if BlueLink's cached data is older than this
force_refresh_if_older_than_hours = 3

# Also alert at the 11 pm check if the car isn't home at all?
alert_if_away_at_last_check = False
last_check_hour = 23

# How to reach you: ntfy (free push, recommended) or twilio (real SMS)
notify = ntfy
ntfy_server = https://ntfy.sh
# Pick something long and unguessable; anyone who knows it can read alerts
ntfy_topic = kona-alert-CHANGE-ME

[twilio]
account_sid =
auth_token =
from =
to =

[arrival]
# Your phone posts here when it disconnects from the Kona's Bluetooth at home.
# Must differ from ntfy_topic above; also make it unguessable.
arrival_topic = kona-arrived-CHANGE-ME
# How long to give you to plug in before checking
delay_minutes = 10
# Caps on BlueLink requests from arrival signals
min_minutes_between_checks = 30
max_checks_per_day = 6

[report]
# Electricity rate in $ per kWh
rate_per_kwh = 0.185
# Usable battery size; 64.8 for the long-range Kona Electric, 48.6 for the standard
battery_kwh = 64.8
# Share of wall energy that reaches the battery (for the cost estimate)
charging_efficiency = 0.9
# Flag the 12 V battery below this %
low_12v_pct = 75

[backup]
# Nightly copy of the whole project (data and logins included) to the NAS
nas_mount = ~/NASstorage2
dest = ~/NASstorage2/BackupApps/kona-plugcheck
keep_days = 60
